<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator">
        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab active" data-tab="basic">基础</button>
            <button class="tab" data-tab="scientific">科学</button>
            <button class="tab" data-tab="programmer">程序员</button>
        </div>

        <!-- Display -->
        <div class="display">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
        </div>

        <!-- Basic Calculator -->
        <div class="panel active" id="panel-basic">
            <div class="btn-grid basic-grid">
                <button class="btn func" data-action="clear">AC</button>
                <button class="btn func" data-action="sign">+/−</button>
                <button class="btn func" data-action="percent">%</button>
                <button class="btn operator" data-op="/">/</button>

                <button class="btn number" data-num="7">7</button>
                <button class="btn number" data-num="8">8</button>
                <button class="btn number" data-num="9">9</button>
                <button class="btn operator" data-op="*">×</button>

                <button class="btn number" data-num="4">4</button>
                <button class="btn number" data-num="5">5</button>
                <button class="btn number" data-num="6">6</button>
                <button class="btn operator" data-op="-">−</button>

                <button class="btn number" data-num="1">1</button>
                <button class="btn number" data-num="2">2</button>
                <button class="btn number" data-num="3">3</button>
                <button class="btn operator" data-op="+">+</button>

                <button class="btn number zero" data-num="0">0</button>
                <button class="btn number" data-action="decimal">.</button>
                <button class="btn equals" data-action="equals">=</button>
            </div>
        </div>

        <!-- Scientific Calculator -->
        <div class="panel" id="panel-scientific">
            <div class="btn-grid scientific-grid">
                <button class="btn func" data-action="clear">AC</button>
                <button class="btn sci" data-sci="square">x²</button>
                <button class="btn sci" data-sci="cube">x³</button>
                <button class="btn operator" data-op="/">/</button>
                <button class="btn sci" data-sci="pow">x^y</button>

                <button class="btn func" data-action="sign">+/−</button>
                <button class="btn sci" data-sci="sqrt">√</button>
                <button class="btn sci" data-sci="cbrt">³√</button>
                <button class="btn operator" data-op="*">×</button>
                <button class="btn sci" data-sci="root">x√y</button>

                <button class="btn func" data-action="percent">%</button>
                <button class="btn sci" data-sci="log">log</button>
                <button class="btn sci" data-sci="ln">ln</button>
                <button class="btn operator" data-op="-">−</button>
                <button class="btn sci" data-sci="eulere">e</button>

                <button class="btn number" data-num="7">7</button>
                <button class="btn number" data-num="8">8</button>
                <button class="btn number" data-num="9">9</button>
                <button class="btn operator" data-op="+">+</button>
                <button class="btn sci" data-sci="pi">π</button>

                <button class="btn number" data-num="4">4</button>
                <button class="btn number" data-num="5">5</button>
                <button class="btn number" data-num="6">6</button>
                <button class="btn sci" data-sci="sin">sin</button>
                <button class="btn sci" data-sci="cos">cos</button>

                <button class="btn number" data-num="1">1</button>
                <button class="btn number" data-num="2">2</button>
                <button class="btn number" data-num="3">3</button>
                <button class="btn sci" data-sci="tan">tan</button>
                <button class="btn sci" data-sci="fact">x!</button>

                <button class="btn number zero" data-num="0">0</button>
                <button class="btn number" data-action="decimal">.</button>
                <button class="btn equals" data-action="equals">=</button>
                <button class="btn sci" data-sci="exp">EXP</button>
            </div>
        </div>

        <!-- Programmer Calculator -->
        <div class="panel" id="panel-programmer">
            <div class="programmer-display">
                <div class="radix-lines">
                    <div class="radix-line" id="dec-line"><span class="radix-label">DEC</span> <span class="radix-value" id="dec-value">0</span></div>
                    <div class="radix-line" id="hex-line"><span class="radix-label">HEX</span> <span class="radix-value" id="hex-value">0</span></div>
                    <div class="radix-line" id="oct-line"><span class="radix-label">OCT</span> <span class="radix-value" id="oct-value">0</span></div>
                    <div class="radix-line" id="bin-line"><span class="radix-label">BIN</span> <span class="radix-value" id="bin-value">0</span></div>
                </div>
                <div class="bit-display" id="bit-display">
                    <span class="bit">0</span><span class="bit">0</span><span class="bit">0</span><span class="bit">0</span>
                    <span class="bit-space"></span>
                    <span class="bit">0</span><span class="bit">0</span><span class="bit">0</span><span class="bit">0</span>
                    <span class="bit-space"></span>
                    <span class="bit">0</span><span class="bit">0</span><span class="bit">0</span><span class="bit">0</span>
                    <span class="bit-space"></span>
                    <span class="bit">0</span><span class="bit">0</span><span class="bit">0</span><span class="bit">0</span>
                </div>
            </div>
            <div class="btn-grid programmer-grid">
                <!-- Row 1: radix toggle + clear -->
                <button class="btn radix-btn active" data-radix="dec">DEC</button>
                <button class="btn radix-btn" data-radix="hex">HEX</button>
                <button class="btn radix-btn" data-radix="oct">OCT</button>
                <button class="btn radix-btn" data-radix="bin">BIN</button>

                <!-- Row 2: bitwise ops -->
                <button class="btn func" data-action="clear">AC</button>
                <button class="btn prog" data-prog="and">AND</button>
                <button class="btn prog" data-prog="or">OR</button>
                <button class="btn prog" data-prog="xor">XOR</button>

                <!-- Row 3: bitwise shift + NOT -->
                <button class="btn func" data-action="sign">NOT</button>
                <button class="btn prog" data-prog="shl">SHL</button>
                <button class="btn prog" data-prog="shr">SHR</button>
                <button class="btn operator" data-op="*">×</button>

                <!-- Row 4: hex keys A-F + div -->
                <button class="btn number" data-num="7">7</button>
                <button class="btn number" data-num="8">8</button>
                <button class="btn number" data-num="9">9</button>
                <button class="btn operator" data-op="/">/</button>

                <!-- Row 5 -->
                <button class="btn number" data-num="4">4</button>
                <button class="btn number" data-num="5">5</button>
                <button class="btn number" data-num="6">6</button>
                <button class="btn operator" data-op="-">−</button>

                <!-- Row 6 -->
                <button class="btn number" data-num="1">1</button>
                <button class="btn number" data-num="2">2</button>
                <button class="btn number" data-num="3">3</button>
                <button class="btn operator" data-op="+">+</button>

                <!-- Row 7 -->
                <button class="btn number zero" data-num="0">0</button>
                <button class="btn number" data-action="decimal">.</button>
                <button class="btn equals" data-action="equals">=</button>
                <button class="btn prog hex-key" data-hex="A">A</button>
            </div>
        </div>
    </div>
    <script src="calc.js"></script>
</body>
</html>
